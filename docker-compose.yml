# Pile complete locale : `cp .env.example .env && docker compose up --build`
# Seul Traefik est publie (127.0.0.1:${GATEWAY_PORT}). Reseaux :
#   edge : traefik <-> hote        app  : traefik, front, shop, auth, mailpit (interne)
#   data : shop, postgres, seaweedfs   (interne, jamais publie)
#   auth-data : auth, postgres-auth    (interne, isole : ni shop ni payment n'y accedent)
#   payment-net  : shop <-> payment (interne) ; payment n'est ni sur app ni publie
#   payment-data : payment <-> payment-db (interne, jamais publie)

name: basecamp

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]

services:
  traefik:
    <<: *hardening
    image: traefik:v3.2
    user: "65532:65532"
    command:
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --entrypoints.web.address=:9080
      - --entrypoints.web.forwardedHeaders.insecure=false
      - --entrypoints.web.transport.respondingTimeouts.readTimeout=30s
      - --entrypoints.web.transport.respondingTimeouts.writeTimeout=30s
      - --entrypoints.web.transport.respondingTimeouts.idleTimeout=60s
      - --ping=true
      - --log.level=INFO
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:9080"
    volumes:
      - ./infra/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks: [edge, app]
    read_only: true
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      front: { condition: service_healthy }
      shop: { condition: service_healthy }
      auth: { condition: service_healthy }

  front:
    <<: *hardening
    image: basecamp-front
    build:
      context: ./apps/frontend
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:8080}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:?voir .env.example}
    environment:
      SHOP_API_URL: ${SHOP_API_URL:-http://shop:8000}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:8080}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?voir .env.example}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?voir .env.example}
      RESEND_API_KEY: ${RESEND_API_KEY:?voir .env.example}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:?voir .env.example}
    networks: [app]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  shop-migrate:
    build: ./apps/backend/shop
    image: basecamp-shop
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment: &shop-env
      APP_ENVIRONMENT: local
      APP_DB_HOST: postgres
      APP_DB_PORT: "5432"
      APP_DB_NAME: ${SHOP_DB_NAME:-shop}
      APP_DB_USER: ${SHOP_DB_USER:-shop}
      APP_DB_PASSWORD: ${SHOP_DB_PASSWORD:?voir .env.example}
    networks: [data]
    depends_on:
      postgres: { condition: service_healthy }

  shop:
    <<: *hardening
    build: ./apps/backend/shop
    image: basecamp-shop
    environment: *shop-env
    networks: [app, data, payment-net]
    read_only: true
    depends_on:
      shop-migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  postgres:
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    image: postgres:17-alpine
    user: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?voir .env.example}
      SHOP_DB_NAME: ${SHOP_DB_NAME:-shop}
      SHOP_DB_USER: ${SHOP_DB_USER:-shop}
      SHOP_DB_PASSWORD: ${SHOP_DB_PASSWORD:?voir .env.example}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-shop-db.sh:/docker-entrypoint-initdb.d/10-init-shop-db.sh:ro
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  payment-migrate:
    build: ./apps/backend/payment
    image: basecamp-payment
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment: &payment-env
      APP_ENVIRONMENT: local
      APP_DB_HOST: payment-db
      APP_DB_PORT: "5432"
      APP_DB_NAME: ${PAYMENT_DB_NAME:-payment}
      APP_DB_USER: ${PAYMENT_DB_USER:-payment}
      APP_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?voir .env.example}
    networks: [payment-data]
    depends_on:
      payment-db: { condition: service_healthy }

  payment:
    <<: *hardening
    build: ./apps/backend/payment
    image: basecamp-payment
    environment: *payment-env
    networks: [payment-net, payment-data]
    read_only: true
    depends_on:
      payment-migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  payment-db:
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    image: postgres:17-alpine
    user: postgres
    # Conteneur dedie : le role applicatif est le seul compte, proprietaire de sa base.
    environment:
      POSTGRES_USER: ${PAYMENT_DB_USER:-payment}
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD:?voir .env.example}
      POSTGRES_DB: ${PAYMENT_DB_NAME:-payment}
    volumes:
      - payment-db-data:/var/lib/postgresql/data
    networks: [payment-data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

  auth-migrate:
    build: ./apps/backend/auth
    image: basecamp-auth
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment: &auth-env
      APP_ENVIRONMENT: local
      APP_DB_HOST: postgres-auth
      APP_DB_PORT: "5432"
      APP_DB_NAME: ${AUTH_DB_NAME:-auth}
      APP_DB_USER: ${AUTH_DB_USER:-auth}
      APP_DB_PASSWORD: ${AUTH_DB_PASSWORD:?voir .env.example}
    networks: [auth-data]
    depends_on:
      postgres-auth: { condition: service_healthy }

  auth:
    <<: *hardening
    build: ./apps/backend/auth
    image: basecamp-auth
    environment: *auth-env
    # Cles de signature generees par scripts/init-auth-keys.sh (jamais versionnees).
    secrets: [auth_jwt_private_key, auth_jwt_public_key]
    networks: [app, auth-data]
    read_only: true
    depends_on:
      auth-migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Postgres dedie a auth : conteneur, volume, reseau et role propres.
  # Le role auth est le seul compte de cette instance (aucun acces croise avec shop).
  postgres-auth:
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    image: postgres:17-alpine
    user: postgres
    environment:
      POSTGRES_USER: ${AUTH_DB_USER:-auth}
      POSTGRES_DB: ${AUTH_DB_NAME:-auth}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?voir .env.example}
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data
    networks: [auth-data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

  seaweedfs:
    <<: *hardening
    image: chrislusf/seaweedfs:latest
    user: "1000:1000"
    command: ["mini", "-dir=/data", "-ip=seaweedfs", "-filer.disableDirListing"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?voir .env.example}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?voir .env.example}
      S3_BUCKET: ${S3_BUCKET:-product-images}
    volumes:
      - seaweedfs-data:/data
    networks: [app, data]
    healthcheck:
      # Sain = master et filer repondent (le listage des dossiers est desactive).
      test:
        - CMD-SHELL
        - "wget -q -O /dev/null http://127.0.0.1:9333/cluster/healthz && wget -q -O /dev/null http://127.0.0.1:8888/healthz"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  seaweedfs-seed:
    image: chrislusf/seaweedfs:latest
    restart: "no"
    user: "1000:1000"
    environment:
      S3_BUCKET: ${S3_BUCKET:-product-images}
    entrypoint: ["/bin/sh", "/seed/upload-images.sh"]
    volumes:
      - ./infra/seed:/seed:ro
    networks: [app]
    depends_on:
      seaweedfs: { condition: service_healthy }

  mailpit:
    <<: *hardening
    image: axllent/mailpit:latest
    user: "1000:1000"
    networks: [app]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  edge: {}
  app:
    internal: true
  data:
    internal: true
  payment-net:
    internal: true
  payment-data:
    internal: true
  auth-data:
    internal: true

volumes:
  postgres-data: {}
  postgres-auth-data: {}
  payment-db-data: {}
  seaweedfs-data: {}

secrets:
  auth_jwt_private_key:
    file: ./.secrets/auth/jwt-private.pem
  auth_jwt_public_key:
    file: ./.secrets/auth/jwt-public.pem
