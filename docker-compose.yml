# Pile complete locale : `cp .env.example .env && docker compose up --build`
# Les images applicatives sont taguees ${COMPOSE_PROJECT_NAME:-basecamp}-<service> : deux piles (projets) ne se partagent pas leurs tags.
# Seul Traefik est publie (127.0.0.1:${GATEWAY_PORT}). Reseaux :
#   edge : traefik <-> hote        app  : traefik, front, shop, auth, mailpit (interne)
#   data : shop, postgres, seaweedfs   (interne, jamais publie)
#   auth-data : auth, postgres-auth    (interne, isole : ni shop ni payment n'y accedent)
#   payment-net  : shop <-> payment (interne) ; payment n'est ni sur app ni publie
#   payment-data : payment <-> payment-db (interne, jamais publie)

name: basecamp

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]

services:
  traefik:
    <<: *hardening
    image: traefik:v3.2
    user: "65532:65532"
    command:
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --entrypoints.web.address=:9080
      - --entrypoints.web.forwardedHeaders.insecure=false
      - --entrypoints.web.transport.respondingTimeouts.readTimeout=30s
      - --entrypoints.web.transport.respondingTimeouts.writeTimeout=30s
      - --entrypoints.web.transport.respondingTimeouts.idleTimeout=60s
      - --ping=true
      - --log.level=INFO
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:9080"
    volumes:
      - ./infra/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks: [edge, app]
    read_only: true
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      front: { condition: service_healthy }
      shop: { condition: service_healthy }
      auth: { condition: service_healthy }

  front:
    <<: *hardening
    image: ${COMPOSE_PROJECT_NAME:-basecamp}-front
    build:
      context: ./apps/frontend
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:8080}
    environment:
      SHOP_API_URL: ${SHOP_API_URL:-http://shop:8000}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:8080}
      RESEND_API_KEY: ${RESEND_API_KEY:?voir .env.example}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:?voir .env.example}
    networks: [app]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  shop-migrate:
    build: ./apps/backend/shop
    image: ${COMPOSE_PROJECT_NAME:-basecamp}-shop
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment: &shop-env
      APP_ENVIRONMENT: local
      APP_DB_HOST: postgres
      APP_DB_PORT: "5432"
      APP_DB_NAME: ${SHOP_DB_NAME:-shop}
      APP_DB_USER: ${SHOP_DB_USER:-shop}
      APP_DB_PASSWORD: ${SHOP_DB_PASSWORD:?voir .env.example}
      # Appels a payment (delais courts dans l application : un payment arrete ne bloque pas shop).
      APP_PAYMENT_URL: http://payment:8000
      # Jeton de service de shop pour payment : demande a auth (POST /internal/token) avec le secret
      # du client `shop` (le meme que celui amorce dans auth), jamais un jeton statique.
      APP_AUTH_CLIENT_SECRET: ${AUTH_SERVICE_CLIENT_SECRET_SHOP:?voir .env.example}
    networks: [data]
    depends_on:
      postgres: { condition: service_healthy }

  shop:
    <<: *hardening
    build: ./apps/backend/shop
    image: ${COMPOSE_PROJECT_NAME:-basecamp}-shop
    environment:
      <<: *shop-env
      # Webhook signe de payment (secret partage avec payment-worker, jamais versionne) : seul shop le recoit.
      APP_PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?voir .env.example}
      APP_PAYMENT_WEBHOOK_SECRET_PREVIOUS: ${PAYMENT_WEBHOOK_SECRET_PREVIOUS:-}
      # Email de confirmation de commande : Mailpit sur le reseau interne `app`, aucun relais externe.
      APP_SMTP_HOST: mailpit
      APP_SMTP_PORT: "1025"
      APP_SMTP_FROM: ${SHOP_SMTP_FROM:-commandes@basecamp.local}
      # Transport des emails : smtp (Mailpit, defaut) ou n8n (webhook ; URL et secret alors obligatoires).
      APP_MAIL_TRANSPORT: ${MAIL_TRANSPORT:-smtp}
      APP_N8N_MAIL_URL: ${N8N_MAIL_URL:-}
      APP_N8N_MAIL_SECRET: ${N8N_MAIL_SECRET:-}
      # Televersement des images produit (API d'administration) : API S3 de SeaweedFS, cles de la pile.
      APP_S3_ENDPOINT: http://seaweedfs:8333
      APP_S3_BUCKET: ${S3_BUCKET:-product-images}
      APP_S3_ACCESS_KEY: ${S3_ACCESS_KEY:?voir .env.example}
      APP_S3_SECRET_KEY: ${S3_SECRET_KEY:?voir .env.example}
    networks: [app, data, payment-net]
    read_only: true
    depends_on:
      shop-migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Traitement d'expiration des commandes impayees (boucle sans etat, un passage par minute).
  shop-expiration:
    <<: *hardening
    build: ./apps/backend/shop
    image: ${COMPOSE_PROJECT_NAME:-basecamp}-shop
    command: ["python", "-m", "app.order_expiration", "--every", "60"]
    environment: *shop-env
    networks: [data]
    read_only: true
    depends_on:
      shop-migrate: { condition: service_completed_successfully }

  postgres:
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    image: postgres:17-alpine
    user: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?voir .env.example}
      SHOP_DB_NAME: ${SHOP_DB_NAME:-shop}
      SHOP_DB_USER: ${SHOP_DB_USER:-shop}
      SHOP_DB_PASSWORD: ${SHOP_DB_PASSWORD:?voir .env.example}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-shop-db.sh:/docker-entrypoint-initdb.d/10-init-shop-db.sh:ro
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  payment-migrate:
    build: ./apps/backend/payment
    image: ${COMPOSE_PROJECT_NAME:-basecamp}-payment
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment: &payment-env
      APP_ENVIRONMENT: local
      APP_DB_HOST: payment-db
      APP_DB_PORT: "5432"
      APP_DB_NAME: ${PAYMENT_DB_NAME:-payment}
      APP_DB_USER: ${PAYMENT_DB_USER:-payment}
      APP_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?voir .env.example}
      # Les jetons des appelants sont signes par auth : payment lit ses cles publiques (JWKS).
      APP_AUTH_JWKS_URL: http://auth:8000/.well-known/jwks.json
    networks: [payment-data]
    depends_on:
      payment-db: { condition: service_healthy }

  payment:
    <<: *hardening
    build: ./apps/backend/payment
    image: ${COMPOSE_PROJECT_NAME:-basecamp}-payment
    environment: *payment-env
    networks: [payment-net, payment-data]
    read_only: true
    # Ressources bornees par instance (compatible avec --scale payment=2) : un abus ne prive pas le reste.
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 128
    depends_on:
      payment-migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Worker de livraison des webhooks signes vers la boutique : meme image et meme base que payment,
  # aucun port. Plusieurs workers sont surs (SKIP LOCKED). Un shop arrete ne l'arrete jamais.
  payment-worker:
    <<: *hardening
    build: ./apps/backend/payment
    image: ${COMPOSE_PROJECT_NAME:-basecamp}-payment
    command: ["python", "-m", "app.webhook.presentation.worker_main"]
    environment:
      <<: *payment-env
      APP_WEBHOOK_URL: ${PAYMENT_WEBHOOK_URL:-http://shop:8000/webhooks/payment}
      APP_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?voir .env.example}
      # Rotation : l'ancien secret signe en parallele jusqu'a la bascule de la boutique.
      APP_WEBHOOK_SECRET_PREVIOUS: ${PAYMENT_WEBHOOK_SECRET_PREVIOUS:-}
      APP_WEBHOOK_MAX_ATTEMPTS: ${PAYMENT_WEBHOOK_MAX_ATTEMPTS:-6}
      APP_WEBHOOK_BACKOFF_BASE_SECONDS: ${PAYMENT_WEBHOOK_BACKOFF_BASE_SECONDS:-5}
    networks: [payment-net, payment-data]
    read_only: true
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    # Pas de serveur HTTP : le HEALTHCHECK de l'image (port 8000) ne s'applique pas. Sain = le
    # processus 1 est bien le worker (`--wait` exige un etat sain).
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys; sys.exit(0 if b'worker_main' in open('/proc/1/cmdline', 'rb').read() else 1)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      payment-migrate: { condition: service_completed_successfully }

  payment-db:
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    image: postgres:17-alpine
    user: postgres
    # Conteneur dedie : le role applicatif est le seul compte, proprietaire de sa base.
    environment:
      POSTGRES_USER: ${PAYMENT_DB_USER:-payment}
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD:?voir .env.example}
      POSTGRES_DB: ${PAYMENT_DB_NAME:-payment}
    volumes:
      - payment-db-data:/var/lib/postgresql/data
    networks: [payment-data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

  auth-migrate:
    build: ./apps/backend/auth
    image: ${COMPOSE_PROJECT_NAME:-basecamp}-auth
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment: &auth-env
      APP_ENVIRONMENT: local
      APP_DB_HOST: postgres-auth
      APP_DB_PORT: "5432"
      APP_DB_NAME: ${AUTH_DB_NAME:-auth}
      APP_DB_USER: ${AUTH_DB_USER:-auth}
      APP_DB_PASSWORD: ${AUTH_DB_PASSWORD:?voir .env.example}
      # Emails (verification d'adresse) : Mailpit sur le reseau interne `app`, aucun relais externe.
      APP_SMTP_HOST: mailpit
      APP_SMTP_PORT: "1025"
      APP_SMTP_FROM: ${AUTH_SMTP_FROM:-comptes@basecamp.local}
      APP_PUBLIC_BASE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:8080}
    networks: [auth-data]
    depends_on:
      postgres-auth: { condition: service_healthy }

  # Amorcage des clients de service (jetons entre services) : one-shot idempotent, seul porteur
  # des secrets en clair (haches argon2id en base). auth, lui, ne voit jamais ces secrets.
  auth-bootstrap:
    build: ./apps/backend/auth
    image: ${COMPOSE_PROJECT_NAME:-basecamp}-auth
    restart: "no"
    command: ["python", "-m", "app.service_token.bootstrap"]
    environment:
      <<: *auth-env
      APP_SERVICE_CLIENTS: '{"shop": ["payments:write"]}'
      APP_SERVICE_CLIENT_SECRET_SHOP: ${AUTH_SERVICE_CLIENT_SECRET_SHOP:?voir .env.example}
      APP_SERVICE_CLIENT_SECRET_SHOP_PREVIOUS: ${AUTH_SERVICE_CLIENT_SECRET_SHOP_PREVIOUS:-}
    networks: [auth-data]
    depends_on:
      auth-migrate: { condition: service_completed_successfully }

  auth:
    <<: *hardening
    build: ./apps/backend/auth
    image: ${COMPOSE_PROJECT_NAME:-basecamp}-auth
    environment: *auth-env
    # Cles de signature generees par scripts/init-auth-keys.sh (jamais versionnees).
    secrets: [auth_jwt_private_key, auth_jwt_public_key]
    # payment-net : payment y lit les cles publiques (JWKS), shop y passe par app pour /internal/token.
    networks: [app, payment-net, auth-data]
    read_only: true
    depends_on:
      auth-migrate: { condition: service_completed_successfully }
      auth-bootstrap: { condition: service_completed_successfully }
      mailpit: { condition: service_healthy }
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Postgres dedie a auth : conteneur, volume, reseau et role propres.
  # Le role auth est le seul compte de cette instance (aucun acces croise avec shop).
  postgres-auth:
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    image: postgres:17-alpine
    user: postgres
    environment:
      POSTGRES_USER: ${AUTH_DB_USER:-auth}
      POSTGRES_DB: ${AUTH_DB_NAME:-auth}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?voir .env.example}
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data
    networks: [auth-data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

  seaweedfs:
    <<: *hardening
    image: chrislusf/seaweedfs:latest
    user: "1000:1000"
    command: ["mini", "-dir=/data", "-ip=seaweedfs", "-filer.disableDirListing"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?voir .env.example}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?voir .env.example}
      S3_BUCKET: ${S3_BUCKET:-product-images}
    volumes:
      - seaweedfs-data:/data
    networks: [app, data]
    healthcheck:
      # Sain = master et filer repondent (le listage des dossiers est desactive).
      test:
        - CMD-SHELL
        - "wget -q -O /dev/null http://127.0.0.1:9333/cluster/healthz && wget -q -O /dev/null http://127.0.0.1:8888/healthz"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  seaweedfs-seed:
    image: chrislusf/seaweedfs:latest
    restart: "no"
    user: "1000:1000"
    environment:
      S3_BUCKET: ${S3_BUCKET:-product-images}
    entrypoint: ["/bin/sh", "/seed/upload-images.sh"]
    volumes:
      - ./infra/seed:/seed:ro
    networks: [app]
    depends_on:
      seaweedfs: { condition: service_healthy }

  # Boite mail de developpement : SMTP 1025 (auth) et interface/API 8025, sur le reseau interne
  # uniquement. Jamais routee par la passerelle ; docker-compose.e2e.yml la publie sur 127.0.0.1.
  mailpit:
    <<: *hardening
    image: axllent/mailpit:latest
    user: "1000:1000"
    read_only: true
    tmpfs: ["/tmp:uid=1000,gid=1000"]
    networks: [app]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  edge: {}
  app:
    internal: true
  data:
    internal: true
  payment-net:
    internal: true
  payment-data:
    internal: true
  auth-data:
    internal: true

volumes:
  postgres-data: {}
  postgres-auth-data: {}
  payment-db-data: {}
  seaweedfs-data: {}

secrets:
  auth_jwt_private_key:
    file: ./.secrets/auth/jwt-private.pem
  auth_jwt_public_key:
    file: ./.secrets/auth/jwt-public.pem
