# Exclusions du calcul de duplication (CPD) uniquement : les analyses (bugs, securite, couverture)
# portent toujours sur ces fichiers.
# Chaque service backend est autonome (aucune bibliotheque partagee, regle d'architecture 3) : son
# squelette (sante, configuration, migrations, conftest, scenarios e2e) est volontairement duplique
# d'un service a l'autre. Voir docs/architecture/services-and-gateway.md.
sonar.cpd.exclusions=apps/backend/**/app/health/**,apps/backend/**/app/core/**,apps/backend/**/alembic/**,apps/backend/**/conftest.py,apps/backend/**/tests/e2e/**,.github/workflows/ci.yml
