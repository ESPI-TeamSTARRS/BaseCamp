[project]
name = "basecamp-payment"
version = "0.1.0"
description = "Paiement maison (intentions, remboursements, grand livre)"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0",
    "structlog>=24.4.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "mypy>=1.11.0",
    "pip-audit>=2.7.3",
    "poethepoet>=0.29.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
minversion = "8.0"
# importlib : permet les fichiers test_x.unit.py (noms avec points) sans __init__.py dans __tests__/.
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=80",
]
testpaths = ["app", "tests"]
python_files = ["test_*.unit.py", "test_*.integ.py", "test_*.e2e.py"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "unit: tests unitaires (rapides, sans I/O)",
    "integ: tests d'integration (ASGI in-process, DB, Redis)",
    "e2e: tests end-to-end (stack complet)",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/**/__init__.py", "app/**/__tests__/**"]

[tool.coverage.report]
precision = 2
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "SIM", "RUF", "S"]
ignore = ["E501", "N818"]

[tool.ruff.lint.per-file-ignores]
"**/__tests__/**/*.py" = ["S101", "S105", "S106"]
"tests/**/*.py" = ["S101"]
"conftest.py" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
show_error_codes = true

[tool.poe.tasks]
lint            = "ruff check ."
"lint:fix"      = "ruff check . --fix"
"format:check"  = "ruff format --check ."
format          = "ruff format ."
typecheck       = "mypy ."
test            = "pytest"
"test:unit"     = "pytest -m unit --no-cov"
"test:integ"    = "pytest -m integ --no-cov"
"test:e2e"      = "pytest -m e2e --no-cov"
"test:cov"      = "pytest -m 'unit or integ' --cov=app --cov-fail-under=80"
"security:deps" = "pip-audit"
security        = ["security:deps"]
quality         = ["lint", "format:check", "typecheck"]
check           = ["quality", "security", "test"]
fix             = ["lint:fix", "format"]
"pre-commit"    = ["lint", "format:check"]
"pre-push"      = ["typecheck", "test:unit"]
