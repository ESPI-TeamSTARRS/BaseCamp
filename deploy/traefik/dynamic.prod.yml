# GENERE A PARTIR DE infra/traefik/dynamic.yml (seul le limiteur de debit differe, voir plus bas).
# Le test scripts/deploy/test_compose_prod.py verifie que les routeurs restent identiques.
# Routage et protections de la passerelle (provider "file" : pas d'acces a la socket Docker).
# Aucun secret ici. Les delais d'expiration des connexions entrantes sont dans docker-compose.yml
# (entrypoints.web.transport.respondingTimeouts), ceux vers les services dans serversTransports.
http:
  routers:
    shop-orders:
      # Limitation de debit stricte sur les commandes (ancien checkout : 10/min).
      rule: "PathPrefix(`/api/shop/orders`)"
      entryPoints: [web]
      middlewares: [orders-rate-limit, body-limit, security-headers, strip-api-shop]
      service: shop
      priority: 200
    shop-admin:
      # API d'administration du catalogue : repondue UNIQUEMENT sur l'origine admin (admin.<domaine>).
      # Sur le domaine principal, /api/shop/admin n'est pas route vers shop (le front repond 404).
      rule: "HostRegexp(`^admin\\..+$`) && PathPrefix(`/api/shop/admin`)"
      entryPoints: [web]
      middlewares: [admin-rate-limit, admin-body-limit, security-headers, strip-api-shop]
      service: shop
      priority: 300
    shop:
      rule: "PathPrefix(`/api/shop`) && !PathPrefix(`/api/shop/webhooks`) && !PathPrefix(`/api/shop/admin`)"
      entryPoints: [web]
      middlewares: [body-limit, security-headers, strip-api-shop]
      service: shop
      priority: 100
    media:
      # Images du catalogue : lecture seule (GET/HEAD) du bucket product-images via le filer.
      rule: "PathPrefix(`/media/`) && (Method(`GET`) || Method(`HEAD`))"
      entryPoints: [web]
      middlewares: [media-path, security-headers]
      service: media
      priority: 150
    auth-signup:
      # Inscription et confirmation d'email : le hachage argon2id coute du CPU et de la memoire,
      # on borne donc le debit par IP (60/min, rafale de 30) en plus du plafond de corps.
      rule: "Path(`/api/auth/register`) || Path(`/api/auth/verify-email`)"
      entryPoints: [web]
      middlewares: [auth-signup-rate-limit, body-limit, security-headers, strip-api-auth]
      service: auth
      priority: 200
    auth-password:
      # Reinitialisation du mot de passe : envoi d'email (forgot) et hachage argon2id (reset).
      # Limite par IP (20/min, rafale de 10) en plus de la limite par adresse faite par le service.
      rule: "Path(`/api/auth/password/forgot`) || Path(`/api/auth/password/reset`)"
      entryPoints: [web]
      middlewares: [auth-password-rate-limit, body-limit, security-headers, strip-api-auth]
      service: auth
      priority: 200
    auth-login:
      # Connexion : meme cout argon2id que l'inscription, donc meme limite par IP (60/min, rafale 30).
      # Le verrouillage de compte (A6) viendra en plus : la passerelle ne remplace pas la defense du service.
      rule: "Path(`/api/auth/login`)"
      entryPoints: [web]
      middlewares: [auth-signup-rate-limit, body-limit, security-headers, strip-api-auth]
      service: auth
      priority: 200
    auth-jwks:
      # Cles publiques de verification des jetons (JWKS), lecture seule, sans prefixe retire :
      # le service les sert a /.well-known/jwks.json.
      rule: "Path(`/.well-known/jwks.json`) && (Method(`GET`) || Method(`HEAD`))"
      entryPoints: [web]
      middlewares: [security-headers]
      service: auth
      priority: 200
    auth:
      # Les routes /internal/* et /metrics ne sont jamais exposees : elles sortent du routeur.
      rule: "PathPrefix(`/api/auth`) && !PathPrefix(`/api/auth/internal`) && !PathPrefix(`/api/auth/metrics`)"
      entryPoints: [web]
      middlewares: [body-limit, security-headers, strip-api-auth]
      service: auth
      priority: 100
    front:
      rule: "PathPrefix(`/`)"
      entryPoints: [web]
      middlewares: [security-headers]
      service: front
      priority: 1

  middlewares:
    media-path:
      replacePathRegex:
        regex: "^/media/(.*)"
        replacement: "/buckets/product-images/$1"
    strip-api-shop:
      stripPrefix:
        prefixes: ["/api/shop"]
    strip-api-auth:
      stripPrefix:
        prefixes: ["/api/auth"]

    orders-rate-limit:
      # PRODUCTION : la requete arrive via Cloudflare puis le Traefik du serveur, donc X-Forwarded-For
      # vaut "client, <Cloudflare>, <proxy Docker>". La cle du limiteur est la premiere adresse
      # (en partant de la droite) qui n'est ni un reseau Docker ni une plage Cloudflare : le vrai
      # client. Sans cela, tous les clients partageraient la limite du proxy.
      # Les plages Cloudflare sont publiques (https://www.cloudflare.com/ips/) : a tenir a jour.
      rateLimit:
        average: 10
        period: 1m
        burst: 5
        sourceCriterion:
          ipStrategy:
            excludedIPs:
              - 172.16.0.0/12
              - 173.245.48.0/20
              - 103.21.244.0/22
              - 103.22.200.0/22
              - 103.31.4.0/22
              - 141.101.64.0/18
              - 108.162.192.0/18
              - 190.93.240.0/20
              - 188.114.96.0/20
              - 197.234.240.0/22
              - 198.41.128.0/17
              - 162.158.0.0/15
              - 104.16.0.0/13
              - 104.24.0.0/14
              - 172.64.0.0/13
              - 131.0.72.0/22
              - 2400:cb00::/32
              - 2606:4700::/32
              - 2803:f800::/32
              - 2405:b500::/32
              - 2405:8100::/32
              - 2a06:98c0::/29
              - 2c0f:f248::/32

    auth-signup-rate-limit:
      # PRODUCTION : la requete arrive via Cloudflare puis le Traefik du serveur, donc X-Forwarded-For
      # vaut "client, <Cloudflare>, <proxy Docker>". La cle du limiteur est la premiere adresse
      # (en partant de la droite) qui n'est ni un reseau Docker ni une plage Cloudflare : le vrai
      # client. Sans cela, tous les clients partageraient la limite du proxy.
      # Les plages Cloudflare sont publiques (https://www.cloudflare.com/ips/) : a tenir a jour.
      rateLimit:
        average: 60
        period: 1m
        burst: 30
        sourceCriterion:
          ipStrategy:
            excludedIPs:
              - 172.16.0.0/12
              - 173.245.48.0/20
              - 103.21.244.0/22
              - 103.22.200.0/22
              - 103.31.4.0/22
              - 141.101.64.0/18
              - 108.162.192.0/18
              - 190.93.240.0/20
              - 188.114.96.0/20
              - 197.234.240.0/22
              - 198.41.128.0/17
              - 162.158.0.0/15
              - 104.16.0.0/13
              - 104.24.0.0/14
              - 172.64.0.0/13
              - 131.0.72.0/22
              - 2400:cb00::/32
              - 2606:4700::/32
              - 2803:f800::/32
              - 2405:b500::/32
              - 2405:8100::/32
              - 2a06:98c0::/29
              - 2c0f:f248::/32

    auth-password-rate-limit:
      # PRODUCTION : la requete arrive via Cloudflare puis le Traefik du serveur, donc X-Forwarded-For
      # vaut "client, <Cloudflare>, <proxy Docker>". La cle du limiteur est la premiere adresse
      # (en partant de la droite) qui n'est ni un reseau Docker ni une plage Cloudflare : le vrai
      # client. Sans cela, tous les clients partageraient la limite du proxy.
      # Les plages Cloudflare sont publiques (https://www.cloudflare.com/ips/) : a tenir a jour.
      rateLimit:
        average: 20
        period: 1m
        burst: 10
        sourceCriterion:
          ipStrategy:
            excludedIPs:
              - 172.16.0.0/12
              - 173.245.48.0/20
              - 103.21.244.0/22
              - 103.22.200.0/22
              - 103.31.4.0/22
              - 141.101.64.0/18
              - 108.162.192.0/18
              - 190.93.240.0/20
              - 188.114.96.0/20
              - 197.234.240.0/22
              - 198.41.128.0/17
              - 162.158.0.0/15
              - 104.16.0.0/13
              - 104.24.0.0/14
              - 172.64.0.0/13
              - 131.0.72.0/22
              - 2400:cb00::/32
              - 2606:4700::/32
              - 2803:f800::/32
              - 2405:b500::/32
              - 2405:8100::/32
              - 2a06:98c0::/29
              - 2c0f:f248::/32

    admin-rate-limit:
      # PRODUCTION : la requete arrive via Cloudflare puis le Traefik du serveur, donc X-Forwarded-For
      # vaut "client, <Cloudflare>, <proxy Docker>". La cle du limiteur est la premiere adresse
      # (en partant de la droite) qui n'est ni un reseau Docker ni une plage Cloudflare : le vrai
      # client. Sans cela, tous les clients partageraient la limite du proxy.
      # Les plages Cloudflare sont publiques (https://www.cloudflare.com/ips/) : a tenir a jour.
      rateLimit:
        average: 30
        period: 1m
        burst: 10
        sourceCriterion:
          ipStrategy:
            excludedIPs:
              - 172.16.0.0/12
              - 173.245.48.0/20
              - 103.21.244.0/22
              - 103.22.200.0/22
              - 103.31.4.0/22
              - 141.101.64.0/18
              - 108.162.192.0/18
              - 190.93.240.0/20
              - 188.114.96.0/20
              - 197.234.240.0/22
              - 198.41.128.0/17
              - 162.158.0.0/15
              - 104.16.0.0/13
              - 104.24.0.0/14
              - 172.64.0.0/13
              - 131.0.72.0/22
              - 2400:cb00::/32
              - 2606:4700::/32
              - 2803:f800::/32
              - 2405:b500::/32
              - 2405:8100::/32
              - 2a06:98c0::/29
              - 2c0f:f248::/32

    admin-body-limit:
      # Televersement d'image : 2 Mio de fichier au plus, plus la marge des en-tetes -> 413 au-dela.
      buffering:
        maxRequestBodyBytes: 3145728 # 3 Mio
        memRequestBodyBytes: 3145728 # tout en memoire : le conteneur est en lecture seule (pas de fichier temporaire)

    body-limit:
      buffering:
        maxRequestBodyBytes: 1048576 # 1 Mio -> 413 au-dela

    security-headers:
      headers:
        forceSTSHeader: true # actif aussi en HTTP local; en production, derriere TLS
        stsSeconds: 63072000
        stsIncludeSubdomains: true
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: strict-origin-when-cross-origin

  serversTransports:
    default:
      forwardingTimeouts:
        dialTimeout: 5s
        responseHeaderTimeout: 30s
        idleConnTimeout: 60s

  services:
    media:
      loadBalancer:
        servers:
          - url: "http://seaweedfs:8888"
    shop:
      loadBalancer:
        serversTransport: default
        servers:
          - url: "http://shop:8000"
    auth:
      loadBalancer:
        serversTransport: default
        servers:
          - url: "http://auth:8000"
    front:
      loadBalancer:
        serversTransport: default
        servers:
          - url: "http://front:3000"
