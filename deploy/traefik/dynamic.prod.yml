    admin-body-limit:
      # Televersement d'image : 2 Mio de fichier au plus, plus la marge des en-tetes -> 413 au-dela.
      buffering:
        maxRequestBodyBytes: 3145728 # 3 Mio
        memRequestBodyBytes: 3145728 # tout en memoire : le conteneur est en lecture seule (pas de fichier temporaire)

    backoffice-body-limit:
      # Trois images de 1 Mo en base64 (4 Mo) plus l'enveloppe JSON -> 413 au-dela de 5 Mio.
      buffering:
        maxRequestBodyBytes: 5242880 # 5 Mio
        memRequestBodyBytes: 5242880 # tout en memoire : le conteneur est en lecture seule

    backoffice-invitation-body-limit:
      # Dix images de 1 Mo en base64 (~13,4 Mo) plus l'enveloppe JSON -> 413 au-dela de 15 Mio.
      buffering:
        maxRequestBodyBytes: 15728640 # 15 Mio
        memRequestBodyBytes: 15728640 # tout en memoire : le conteneur est en lecture seule

    body-limit:
      buffering:
        maxRequestBodyBytes: 1048576 # 1 Mio -> 413 au-dela

    security-headers:
      headers:
        forceSTSHeader: true # actif aussi en HTTP local; en production, derriere TLS
        stsSeconds: 63072000
        stsIncludeSubdomains: true
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: strict-origin-when-cross-origin

  serversTransports:
    default:
      forwardingTimeouts:
        dialTimeout: 5s
        responseHeaderTimeout: 30s
        idleConnTimeout: 60s

  services:
    media:
      loadBalancer:
        servers:
          - url: "http://seaweedfs:8888"
    shop:
      loadBalancer:
        serversTransport: default
        servers:
          - url: "http://shop:8000"
    auth:
      loadBalancer:
        serversTransport: default
        servers:
          - url: "http://auth:8000"
    front:
      loadBalancer:
        serversTransport: default
        servers:
          - url: "http://front:3000"
    backoffice:
      loadBalancer:
        serversTransport: default
        servers:
          - url: "http://backoffice:3000"
