# Surcouche de SUPERVISION de la pile de developpement (a ajouter avec -f, seulement quand on supervise) :
#
#   docker network create --internal supervision      # une fois ; cree par le depot Supervision
#   docker compose -f docker-compose.yml -f docker-compose.supervision.yml up -d --build --wait
#
# Elle ne modifie aucun service existant : elle les raccorde au reseau externe `supervision` et
# ajoute trois exporters Postgres en lecture seule. Voir docs/deployment/supervision.md.
#   supervision          (externe) : traefik (metriques :9100), shop et auth (sondes /health),
#                        exporters Postgres. Ne contient ni payment, ni front, ni les bases.
#   supervision-payment  (interne) : payment et la sonde du depot Supervision, rien d'autre.
#                        Evite d'ouvrir payment-net : le front et la supervision generale
#                        n'atteignent toujours pas payment (scripts/check-payment-isolation.sh).
# Cibles de scrape stables : basecamp-shop, basecamp-auth, basecamp-payment, basecamp-traefik,
# basecamp-pg-exporter-{shop,auth,payment} (le nom court du service reste aussi resolu).

x-exporter: &exporter
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1@sha256:38606faa38c54787525fb0ff2fd6b41b4cfb75d455c1df294927c5f611699b17
  user: "65534:65534"
  read_only: true
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9187/metrics"]
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 5s

services:
  traefik:
    networks:
      supervision:
        aliases: [basecamp-traefik]

  shop:
    networks:
      supervision:
        aliases: [basecamp-shop]

  auth:
    networks:
      supervision:
        aliases: [basecamp-auth]

  payment:
    networks:
      supervision-payment:
        aliases: [basecamp-payment]

  postgres:
    environment:
      MONITORING_DB_PASSWORD: ${MONITORING_DB_PASSWORD_SHOP:?voir .env.example}
    volumes:
      - ./infra/postgres/init-monitoring.sh:/docker-entrypoint-initdb.d/20-init-monitoring.sh:ro

  postgres-auth:
    environment:
      MONITORING_DB_PASSWORD: ${MONITORING_DB_PASSWORD_AUTH:?voir .env.example}
    volumes:
      - ./infra/postgres/init-monitoring-auth.sh:/docker-entrypoint-initdb.d/20-init-monitoring.sh:ro

  payment-db:
    environment:
      MONITORING_DB_PASSWORD: ${MONITORING_DB_PASSWORD_PAYMENT:?voir .env.example}
    volumes:
      - ./infra/postgres/init-monitoring-payment.sh:/docker-entrypoint-initdb.d/20-init-monitoring.sh:ro

  pg-exporter-shop:
    <<: *exporter
    environment:
      DATA_SOURCE_URI: postgres:5432/postgres?sslmode=disable
      DATA_SOURCE_USER: monitoring
      DATA_SOURCE_PASS: ${MONITORING_DB_PASSWORD_SHOP:?voir .env.example}
    networks:
      data: {}
      supervision:
        aliases: [basecamp-pg-exporter-shop]
    depends_on:
      postgres: { condition: service_healthy }

  pg-exporter-auth:
    <<: *exporter
    environment:
      DATA_SOURCE_URI: postgres-auth:5432/postgres?sslmode=disable
      DATA_SOURCE_USER: monitoring
      DATA_SOURCE_PASS: ${MONITORING_DB_PASSWORD_AUTH:?voir .env.example}
    networks:
      auth-data: {}
      supervision:
        aliases: [basecamp-pg-exporter-auth]
    depends_on:
      postgres-auth: { condition: service_healthy }

  pg-exporter-payment:
    <<: *exporter
    environment:
      DATA_SOURCE_URI: payment-db:5432/postgres?sslmode=disable
      DATA_SOURCE_USER: monitoring
      DATA_SOURCE_PASS: ${MONITORING_DB_PASSWORD_PAYMENT:?voir .env.example}
    networks:
      payment-data: {}
      supervision:
        aliases: [basecamp-pg-exporter-payment]
    depends_on:
      payment-db: { condition: service_healthy }

networks:
  # Cree par le depot Supervision (docker network create --internal supervision).
  supervision:
    name: ${SUPERVISION_NETWORK:-supervision}
    external: true
  # Cree par cette pile ; la sonde de payment (depot Supervision) le rejoint en reseau externe.
  supervision-payment:
    name: ${SUPERVISION_PAYMENT_NETWORK:-supervision-payment}
    internal: true
