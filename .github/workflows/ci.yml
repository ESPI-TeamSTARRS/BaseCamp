name: CI

# Une matrice par service backend (un projet uv chacun) + le front, en parallele.
# Chaque job appelle les taches poe/npm du service : jamais d'outil en direct.
# Ajouter un service = ajouter son nom dans la matrice `service`.
# `ci-ok` est le seul check a rendre obligatoire dans la protection de branche.

on:
  # Pas de declencheur push : les branches de travail sont couvertes par la PR (evite la CI en double),
  # et sur main la CI est jouee par release.yml (appel de ce workflow) avant le calcul des versions.
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  backend:
    name: backend-${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: [shop, auth, payment]
    defaults:
      run:
        working-directory: apps/backend/${{ matrix.service }}
    # Postgres jetable pour le test de concurrence de shop (SELECT ... FOR UPDATE) et les tests Postgres
    # de payment (concurrence, migrations), sans mot de passe (trust) car il n'ecoute que dans le job.
    # Les services ignorent la variable qui ne les concerne pas.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APP_TEST_POSTGRES_URL: postgresql+psycopg://postgres@127.0.0.1:5432/postgres
      PAYMENT_TEST_DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/backend/${{ matrix.service }}/uv.lock
      - run: uv sync --frozen
      - name: Qualite (lint, format, types)
        run: uv run poe quality
      - name: Tests + couverture (seuil 80 %)
        run: uv run poe test
      - name: Securite (CVE des dependances)
        run: uv run poe security
      - name: Build de l'image
        run: docker build -t basecamp-${{ matrix.service }}:ci .

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - name: Qualite (lint, format, types)
        run: npm run quality
      - name: Tests + couverture (seuil 80 %)
        run: npm run test:coverage
      - name: Securite des dependances
        # Bloquant : aucune vulnerabilite critique ou elevee toleree dans les dependances de production.
        run: npm run security
      - name: Build
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: "1"

  secrets-scan:
    name: secrets-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (commits apportés par la PR ou le push)
        # Ne scanne que ce que l'événement apporte, pas les autres branches : un faux jeton
        # poussé sur une branche de travail ne doit pas faire échouer les autres PR.
        # Historique complet : workflow `secrets-history.yml` (manuel et planifié).
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          if [ "$EVENT" = "pull_request" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -n "$PUSH_AFTER" ] && [ "${PUSH_BEFORE#0000000}" = "$PUSH_BEFORE" ] && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            range="$PUSH_BEFORE..$PUSH_AFTER"
          else
            # Nouvelle branche ou suppression d'historique : tout ce que HEAD ajoute à main.
            range="origin/main..HEAD"
          fi
          echo "gitleaks sur $range"
          ./gitleaks git --redact -v --log-opts="$range" .

  tools:
    name: outils-racine
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run poe tools-test

  stack-e2e:
    name: stack-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      E2E_BASE_URL: http://127.0.0.1:8080
      # Surcharge de test : publie l'API de Mailpit sur 127.0.0.1 pour lire les emails d'inscription.
      COMPOSE_FILE: docker-compose.yml:docker-compose.e2e.yml
      E2E_MAILPIT_URL: http://127.0.0.1:8025
      # Webhook payment -> shop : recepteur factice dans le conteneur shop, relances rapprochees.
      PAYMENT_WEBHOOK_URL: http://shop:9100/webhooks/payment
      PAYMENT_WEBHOOK_BACKOFF_BASE_SECONDS: "2"
    steps:
      - uses: actions/checkout@v4
      - name: Fichier .env de CI (valeurs factices) et cles de signature auth (non versionnees)
        run: |
          cp .env.example .env
          sh scripts/init-auth-keys.sh
      - uses: docker/setup-buildx-action@v3
      - name: Image shop (cache GHA)
        uses: docker/build-push-action@v6
        with:
          context: apps/backend/shop
          load: true
          tags: basecamp-shop
          cache-from: type=gha,scope=shop
          cache-to: type=gha,scope=shop,mode=max
      - name: Image auth (build compose, sans action tierce)
        run: docker compose build auth
      - name: Image payment (cache GHA)
        uses: docker/build-push-action@v6
        with:
          context: apps/backend/payment
          load: true
          tags: basecamp-payment
          cache-from: type=gha,scope=payment
          cache-to: type=gha,scope=payment,mode=max
      - name: Image front (cache GHA)
        uses: docker/build-push-action@v6
        with:
          context: apps/frontend
          load: true
          tags: basecamp-front
          build-args: |
            NEXT_PUBLIC_SITE_URL=http://localhost:8080
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=pk_test_dummy
          cache-from: type=gha,scope=front
          cache-to: type=gha,scope=front,mode=max
      - name: Pile minimale (Traefik, front, shop, auth, payment et son worker, Mailpit, bucket d images et leurs bases) healthy
        run: docker compose up -d --no-build --wait --wait-timeout 120 --scale payment=2 traefik payment payment-worker seaweedfs mailpit
      - name: Amorcage des clients de service (jetons entre services) rejouable sans effet
        run: docker compose run --rm --no-deps auth-bootstrap
      - name: Amorcage du bucket (visuels du catalogue)
        run: docker compose run --rm --no-deps seaweedfs-seed
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/backend/shop/uv.lock
      - run: uv sync --frozen
        working-directory: apps/backend/shop
      - name: Scenarios e2e contre Traefik
        run: uv run poe test:e2e
        working-directory: apps/backend/shop
      - run: uv sync --frozen --no-build --python 3.13
        working-directory: apps/backend/auth
      - name: Scenarios e2e auth (passerelle, jetons de service, inscription avec Mailpit, journaux)
        run: uv run --frozen --no-build poe test:e2e
        working-directory: apps/backend/auth
        env:
          E2E_CHECK_LOGS: "1"
      - name: Isolation de payment (reseau, bases, migrations, readiness)
        run: sh scripts/check-payment-isolation.sh
      - run: uv sync --frozen
        working-directory: apps/backend/payment
      - name: Scenarios e2e de payment (charge, attaque, 2 instances, arret, webhook signe, signaux) depuis l'exterieur
        run: uv run poe test:e2e
        working-directory: apps/backend/payment
      - name: Logs des conteneurs
        if: failure()
        run: docker compose logs --no-color > compose-logs.txt
      - name: Publier les logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stack-e2e-logs
          path: compose-logs.txt
      - name: Nettoyage de la pile
        if: always()
        run: docker compose down -v

  deploy-rollback:
    name: deploy-rollback
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # Aucune dependance Python a installer : le script n'utilise que la bibliotheque standard.
      - name: Bascule et retour arriere de scripts/deploy.sh (panne volontaire)
        run: bash scripts/deploy/test-deploy.sh

  ci-ok:
    name: ci-ok
    if: always()
    needs: [backend, frontend, secrets-scan, tools, stack-e2e, deploy-rollback]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Tous les jobs bloquants sont verts
        run: |
          echo '${{ toJSON(needs) }}' | grep -q '"result": "\(failure\|cancelled\)"' && exit 1 || exit 0
