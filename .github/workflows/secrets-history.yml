name: Secrets history

# Scan gitleaks de l'historique de main (hors branches de travail), a la demande et chaque semaine.
# Le job `secrets-scan` de ci.yml ne regarde que ce qu'une PR ou un push apporte.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

permissions: {}

jobs:
  secrets-history:
    name: secrets-history
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: gitleaks (historique de main)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact -v --log-opts="origin/main" .
