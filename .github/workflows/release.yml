name: Release

# A chaque push sur main : rejoue la CI (workflow reutilise), puis, si elle est verte, calcule la
# prochaine version semver de chaque composant (shop, auth, payment, frontend) avec
# python-semantic-release et pose le tag `<service>-vX.Y.Z` sur le commit de main. Aucun commit
# n'est ecrit sur main (branche protegee) : le tag est la version de reference. Le build et la
# publication de l'image se font dans CE workflow (un tag pousse avec GITHUB_TOKEN ne declenche
# aucun autre workflow).

on:
  push:
    branches: [main]
    # La fusion de la PR de manifeste ne change que ce fichier : rien a versionner ni a construire.
    paths-ignore: [deploy/manifest.json]
  workflow_dispatch:
    # Publie les images d'une version deja taguee mais pas encore publiee (ex. les premiers tags v0.1.0).

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  ci:
    name: ci
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  # Test de bout en bout, en parallele de la CI. Non bloquant tant que la variable de depot E2E_BLOQUANT
  # n'est pas "true" : un echec reste visible (job rouge) mais la publication continue (voir docs/development/ci.md).
  e2e:
    name: e2e
    permissions:
      contents: read
    uses: ./.github/workflows/e2e.yml

  version:
    name: version-${{ matrix.service }}
    needs: [ci, e2e]
    if: ${{ !cancelled() && needs.ci.result == 'success' && (needs.e2e.result == 'success' || vars.E2E_BLOQUANT != 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: shop
            dir: apps/backend/shop
            config: pyproject.toml
          - service: auth
            dir: apps/backend/auth
            config: pyproject.toml
          - service: payment
            dir: apps/backend/payment
            config: pyproject.toml
          - service: frontend
            dir: apps/frontend
            config: releaserc.toml
          - service: backoffice
            dir: apps/backoffice
            config: releaserc.toml
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Branche main (python-semantic-release refuse un HEAD detache)
        run: git checkout -B main "$GITHUB_SHA"
        working-directory: .
      - name: Installer python-semantic-release (versions et empreintes verrouillees)
        run: |
          uv venv "$RUNNER_TEMP/psr"
          uv pip install --python "$RUNNER_TEMP/psr" --require-hashes --no-build -r "$GITHUB_WORKSPACE/scripts/release/requirements.txt"
          echo "$RUNNER_TEMP/psr/bin" >> "$GITHUB_PATH"
      - name: Prochaine version
        id: next
        env:
          PSR_CONFIG: ${{ matrix.config }}
        run: |
          next="$(semantic-release --config "$PSR_CONFIG" version --print || true)"
          echo "Prochaine version : ${next:-aucune}"
          last="$(semantic-release --config "$PSR_CONFIG" version --print-last-released || true)"
          if [ -n "$next" ] && [ "$next" != "$last" ]; then
            echo "version=$next" >> "$GITHUB_OUTPUT"
          fi
      - name: Tag du service
        if: steps.next.outputs.version != ''
        env:
          PSR_CONFIG: ${{ matrix.config }}
          TAG: ${{ matrix.service }}-v${{ steps.next.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          semantic-release --config "$PSR_CONFIG" \
            version --no-commit --no-changelog --no-vcs-release --no-push
          # Seul le tag part : pousser la branche echouerait si main a avance entre-temps.
          git push origin "refs/tags/$TAG"
      - name: Cible de publication
        id: target
        env:
          PSR_CONFIG: ${{ matrix.config }}
          EVENT: ${{ github.event_name }}
          NEXT_VERSION: ${{ steps.next.outputs.version }}
          SERVICE: ${{ matrix.service }}
        run: |
          # Nouvelle version = on construit le commit courant. Declenchement manuel sans nouvelle
          # version = on republie la derniere version taguee si son image manque.
          version="$NEXT_VERSION"
          if [ -z "$version" ] && [ "$EVENT" = workflow_dispatch ]; then
            version="$(semantic-release --config "$PSR_CONFIG" version --print-last-released || true)"
            [ "$version" = "0.0.0" ] && version=""
            if [ -n "$version" ]; then
              git checkout --detach "refs/tags/$SERVICE-v$version"
            fi
          fi
          if [ -z "$version" ]; then
            echo "Rien a publier pour $SERVICE."
            exit 0
          fi
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$owner/basecamp-$SERVICE" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - name: Connexion a GHCR
        if: steps.target.outputs.version != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image deja publiee ?
        id: exists
        if: steps.target.outputs.version != ''
        env:
          REF: ${{ steps.target.outputs.image }}:${{ steps.target.outputs.version }}
        run: |
          # Un tag de version est immuable : on ne republie jamais par-dessus.
          if docker buildx imagetools inspect "$REF" > /dev/null 2>&1; then
            echo "$REF existe deja, publication ignoree."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.target.outputs.version != '' && steps.exists.outputs.skip != 'true'
      - name: Build et push (provenance + SBOM)
        id: build
        if: steps.target.outputs.version != '' && steps.exists.outputs.skip != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.dir }}
          push: true
          # Tag provisoire par commit : les tags de version ne sont poses qu'apres controle (ci-dessous).
          tags: ${{ steps.target.outputs.image }}:sha-${{ steps.target.outputs.short_sha }}
          provenance: mode=max
          sbom: true
          # Seule valeur de build : une URL publique, jamais un secret (voir docs/development/images.md).
          build-args: ${{ matrix.service == 'frontend' && format('NEXT_PUBLIC_SITE_URL={0}', vars.SITE_URL || 'https://basecamp.tempulse.fr') || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.target.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=basecamp-${{ matrix.service }}
      - name: Scan Trivy bloquant avant tout tag de version (HIGH, CRITICAL corrigeables, secrets)
        if: steps.target.outputs.version != '' && steps.exists.outputs.skip != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.target.outputs.image }}@${{ steps.build.outputs.digest }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          # Une faille sans correctif disponible ne bloque pas : on ne peut rien y faire (voir docs/development/images.md).
          ignore-unfixed: true
          exit-code: "1"
          format: table
          trivyignores: .trivyignore
      - name: Poser les tags de version sur le digest construit
        if: steps.target.outputs.version != '' && steps.exists.outputs.skip != 'true'
        env:
          IMAGE: ${{ steps.target.outputs.image }}
          VERSION: ${{ steps.target.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SERVICE: ${{ matrix.service }}
        run: |
          minor="${VERSION%.*}"
          docker buildx imagetools create -t "$IMAGE:$VERSION" -t "$IMAGE:$minor" "$IMAGE@$DIGEST"
          echo "### $SERVICE $VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "$IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"

  manifest:
    name: manifeste-de-deploiement
    needs: version
    # Meme si un composant echoue (ex. scan Trivy), les versions deja publiees entrent dans le manifeste.
    if: ${{ !cancelled() && needs.version.result != 'skipped' }}
    runs-on: ubuntu-latest
    # Lecture seule : les ecritures passent par le jeton court de la GitHub App.
    permissions:
      contents: read
      packages: read
    env:
      BRANCH: release/manifest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Connexion a GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derniere version publiee de chaque composant (tag git + digest GHCR)
        run: |
          set -euo pipefail
          # Composants du manifeste, plus les facultatifs (ajoutes au manifeste des que leur image existe).
          optional="$(python3 -c 'import sys; sys.path.insert(0, "scripts/deploy"); import manifest; print(*manifest.OPTIONAL_SERVICES, sep="\n")')"
          services="$( { jq -r '.services | keys[]' deploy/manifest.json; echo "$optional"; } | sort -u)"
          # shellcheck disable=SC2086
          python3 scripts/deploy/latest_images.py "$GITHUB_REPOSITORY_OWNER" $services > "$RUNNER_TEMP/latest.jsonl"
          cat "$RUNNER_TEMP/latest.jsonl"
      - name: Jeton de la GitHub App
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Proposer la mise a jour du manifeste
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"

          open_pr="$(gh api "repos/$REPO/pulls?state=open&head=${REPO%%/*}:$BRANCH" --jq '.[0].number // empty')"

          # Le manifeste est toujours recalcule depuis main : jamais de conflit apres la fusion d'une PR precedente.
          set +e
          { jq -c . deploy/manifest.json; cat "$RUNNER_TEMP/latest.jsonl"; } | python3 scripts/deploy/update_manifest.py > "$RUNNER_TEMP/new.json"
          rc=$?
          set -e
          if [[ "$rc" == 10 ]]; then
            echo "Manifeste deja a jour."
            if [[ -n "$open_pr" ]]; then
              gh api --method POST "repos/$REPO/issues/$open_pr/comments" -f body="Le manifeste de main est déjà à jour : PR fermée." --jq .html_url
              gh api --method PATCH "repos/$REPO/pulls/$open_pr" -f state=closed --jq .html_url
            fi
            exit 0
          fi
          [[ "$rc" == 0 ]] || exit "$rc"

          jq -c . deploy/manifest.json "$RUNNER_TEMP/new.json" | python3 scripts/deploy/update_manifest.py describe > "$RUNNER_TEMP/changes.txt"
          title="chore(release): deploie $(paste -sd, "$RUNNER_TEMP/changes.txt" | sed 's/ -> /->/g; s/,/, /g')"
          {
            echo "Mise a jour du manifeste de deploiement (dernieres versions publiees, images par digest, tests et scan Trivy passes) :"
            echo
            sed 's/^/- /' "$RUNNER_TEMP/changes.txt"
            echo
            echo "La fusion declenche le deploiement sur la VM (minuteur), avec retour automatique si le test de fumee echoue."
          } > "$RUNNER_TEMP/body.md"

          git fetch --quiet origin main
          git fetch --quiet origin "$BRANCH" || true
          git checkout -B "$BRANCH" origin/main
          cp "$RUNNER_TEMP/new.json" deploy/manifest.json
          git add deploy/manifest.json
          if git diff --cached --quiet; then
            # Course : une PR de manifeste a ete fusionnee entre le calcul et ce point, main est deja a jour.
            echo "Manifeste de main deja a jour."
            if [[ -n "$open_pr" ]]; then
              gh api --method POST "repos/$REPO/issues/$open_pr/comments" -f body="Le manifeste de main est déjà à jour : PR fermée." --jq .html_url
              gh api --method PATCH "repos/$REPO/pulls/$open_pr" -f state=closed --jq .html_url
            fi
            exit 0
          fi
          git commit --quiet -m "$title"
          # Branche du bot uniquement : on n'ecrase que ce qu'on vient de lire.
          git push --force-with-lease="$BRANCH" --quiet origin "$BRANCH"

          # API REST (et non `gh pr create`, qui passe par GraphQL et a ete refuse pour l'App).
          if [[ -n "$open_pr" ]]; then
            gh api --method PATCH "repos/$REPO/pulls/$open_pr" -f title="$title" -F body=@"$RUNNER_TEMP/body.md" --jq .html_url
          else
            gh api --method POST "repos/$REPO/pulls" -f title="$title" -f head="$BRANCH" -f base=main -F body=@"$RUNNER_TEMP/body.md" --jq .html_url
          fi || {
            echo "La PR n'a pas pu etre ouverte. La branche est prete : https://github.com/$REPO/compare/main...$BRANCH"
            exit 1
          }
