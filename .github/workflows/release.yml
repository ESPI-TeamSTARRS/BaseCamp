name: Release

# Apres une CI verte sur main, calcule la prochaine version semver de chaque composant
# (shop, auth, payment, frontend) avec python-semantic-release et pose le tag `<service>-vX.Y.Z`
# sur le commit de main. Aucun commit n'est ecrit sur main (branche protegee) : le tag est la
# version de reference. Les etapes de build et de publication d'image viendront dans CE workflow
# (un tag pousse avec GITHUB_TOKEN ne declenche aucun autre workflow).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

env:
  PSR: python-semantic-release==10.5.3

jobs:
  version:
    name: version-${{ matrix.service }}
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: shop
            dir: apps/backend/shop
            config: pyproject.toml
          - service: auth
            dir: apps/backend/auth
            config: pyproject.toml
          - service: payment
            dir: apps/backend/payment
            config: pyproject.toml
          - service: frontend
            dir: apps/frontend
            config: releaserc.toml
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Branche main (python-semantic-release refuse un HEAD detache)
        run: git checkout -B main "${{ github.event.workflow_run.head_sha }}"
        working-directory: .
      - name: Prochaine version
        id: next
        run: |
          next="$(uvx --from "$PSR" semantic-release --config ${{ matrix.config }} version --print || true)"
          echo "Prochaine version : ${next:-aucune}"
          last="$(uvx --from "$PSR" semantic-release --config ${{ matrix.config }} version --print-last-released || true)"
          if [ -n "$next" ] && [ "$next" != "$last" ]; then
            echo "version=$next" >> "$GITHUB_OUTPUT"
          fi
      - name: Tag ${{ matrix.service }}-v${{ steps.next.outputs.version }}
        if: steps.next.outputs.version != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uvx --from "$PSR" semantic-release --config ${{ matrix.config }} \
            version --no-commit --no-changelog --no-vcs-release --no-push
          # Seul le tag part : pousser la branche echouerait si main a avance entre-temps.
          git push origin "refs/tags/${{ matrix.service }}-v${{ steps.next.outputs.version }}"
